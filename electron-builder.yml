appId: com.deskwand.app
productName: DeskWand
directories:
  output: release
  buildResources: resources

npmRebuild: true
afterPack: ./scripts/after-pack.js
afterAllArtifactBuild: ./scripts/compress-dmg.js

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - node_modules/@img/**/*
  - node_modules/@anthropic-ai/sdk/**/*
  - node_modules/@larksuiteoapi/**/*
  - node_modules/openai/**/*
  - node_modules/@modelcontextprotocol/**/*
  - node_modules/electron-updater/**/*
  - node_modules/chokidar/**/*
  - node_modules/archiver/**/*
  - node_modules/ngrok/**/*
  - node_modules/ws/**/*
  - node_modules/glob/**/*
  - node_modules/dotenv/**/*
  - node_modules/bufferutil/**/*
  - node_modules/utf-8-validate/**/*
  # Exclude non-essential files from node_modules to reduce bundle size
  - "!**/*.js.map"
  - "!**/*.mjs.map"
  - "!**/*.d.ts.map"
  - "!**/*.mts.map"
  - "!**/*.d.ts"
  - "!**/*.ts"
  - "!**/README.md"
  - "!**/CHANGELOG.md"
  - "!**/CHANGELOG"
  - "!**/LICENSE"
  - "!**/LICENSE.md"
  - "!**/.npmignore"
  - "!**/.eslintrc*"
  - "!**/tsconfig.json"
  # esbuild 的 android-* / openharmony-* 包各带一份 14MB 的 esbuild.wasm（三份内容相同）。
  # 它们的字节在 asar 内部（smartUnpack 不解包 .wasm），afterPack 的 app.asar.unpacked
  # 清理碰不到，所以在这里按平台无关的模式排除（≈40MB）。没有用 ${arch} 宏是有意的：
  # 这两个平台任何桌面目标都不会加载，交叉打包也安全。目标平台的 @esbuild/<platform>-<arch>
  # 仍由 after-pack.js 保留，不要删那一段。
  - "!**/node_modules/@esbuild/android-*/**/*"
  - "!**/node_modules/@esbuild/openharmony-*/**/*"

# MCP servers and platform-specific resources are declared in each platform's
# extraResources section below (win/mac/linux).

# Skills are extracted via extraResources (per-platform) to avoid asar symlink issues.
# Sharp native modules must also be unpacked for image processing.
# Note: MCP servers are bundled with esbuild (all deps inlined), so no need to unpack MCP SDK
asarUnpack:
  - node_modules/@img/**/*.node
  - node_modules/@img/**/*.dll
  - node_modules/@img/**/*.dylib
  - node_modules/@img/**/*.so
  - node_modules/bufferutil/**/*.node
  - node_modules/utf-8-validate/**/*.node
  # codemode 的两个运行期产物：worker_threads 从 asar 内加载未在 CI 验证，
  # 解包后 asar 内的原路径仍可读（Electron 会重定向到 app.asar.unpacked）。
  - dist-electron/main/worker.js
  - dist-electron/main/codemode-worker.js
  - dist-electron/main/image-resize-worker.js
  - dist-electron/main/node_modules/quickjs-wasi/quickjs.wasm

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  signAndEditExecutable: false
  extraResources:
    - from: resources/icon.ico
      to: icon.ico
    - from: .bundle-resources/mcp
      to: mcp
    - from: resources/node/win32-x64
      to: node
    - from: dist-wsl-agent
      to: wsl-agent
    - from: resources/msys2/win32-x64
      to: msys2
    - from: resources/bin/win32-x64
      to: bin
    # Voice runtime/model download coordinates (URL + sha256 only).
    - from: resources/voice-runtime.json
      to: voice-runtime.json
    # OCR runtime/model download coordinates (URL + sha256 only).
    - from: resources/ocr-runtime.json
      to: ocr-runtime.json
    # Silero VAD 模型（643KB，MIT）。随包而非下载：见 runtime-spec.ts 的注释。
    # sha256: 9e2449e1087496d8d4caba907f23e0bd3f78d91fa552479bb9c23ac09cbb1fd6
    - from: resources/silero_vad.onnx
      to: silero_vad.onnx
    - from: .deskwand/skills
      to: skills
mac:
  icon: resources/icon.icns
  target:
    - target: dir
      arch:
        - arm64
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  identity: "DeskWand Self-Signed"
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    LSApplicationCategoryType: public.app-category.developer-tools
    NSMicrophoneUsageDescription: "DeskWand needs microphone access for voice input in the chat box."
    NSScreenCaptureUsageDescription: "DeskWand needs screen recording access for GUI automation."
    NSAccessibilityUsageDescription: "DeskWand needs accessibility access for GUI automation."
  extraResources:
    - from: .bundle-resources/mcp
      to: mcp
    - from: resources/node/darwin-${arch}
      to: node
    # Bundled single-file helper binaries (officecli, cliclick) so packaged apps
    # work without user-installed tools
    - from: resources/bin/darwin-${arch}
      to: bin
    - from: dist-lima-agent
      to: lima-agent
    # Voice runtime/model download coordinates (URL + sha256 only).
    - from: resources/voice-runtime.json
      to: voice-runtime.json
    # OCR runtime/model download coordinates (URL + sha256 only).
    - from: resources/ocr-runtime.json
      to: ocr-runtime.json
    # Silero VAD 模型（643KB，MIT）。随包而非下载：见 runtime-spec.ts 的注释。
    # sha256: 9e2449e1087496d8d4caba907f23e0bd3f78d91fa552479bb9c23ac09cbb1fd6
    - from: resources/silero_vad.onnx
      to: silero_vad.onnx
    - from: .deskwand/skills
      to: skills

linux:
  icon: resources/icon.png
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  extraResources:
    - from: .bundle-resources/mcp
      to: mcp
    - from: resources/node/linux-x64
      to: node
    - from: resources/bin/linux-x64
      to: bin
    # Voice runtime/model download coordinates (URL + sha256 only).
    - from: resources/voice-runtime.json
      to: voice-runtime.json
    # OCR runtime/model download coordinates (URL + sha256 only).
    - from: resources/ocr-runtime.json
      to: ocr-runtime.json
    # Silero VAD 模型（643KB，MIT）。随包而非下载：见 runtime-spec.ts 的注释。
    # sha256: 9e2449e1087496d8d4caba907f23e0bd3f78d91fa552479bb9c23ac09cbb1fd6
    - from: resources/silero_vad.onnx
      to: silero_vad.onnx
    - from: .deskwand/skills
      to: skills

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: installer.nsh
  warningsAsErrors: false
  # Preserve user config/history by default; offer explicit cleanup tooling instead of destructive uninstall.
  deleteAppDataOnUninstall: false

dmg:
  # Explicit size to avoid dmgbuild "No space left on device" for large apps.
  # The temporary writable DMG is auto-shrunk after copying, so this doesn't
  # affect final DMG size. Our ULMO compression hook further reduces it.
  size: "3g"
  window:
    width: 600
    height: 440
  contents:
    - x: 150
      y: 220
      name: "DeskWand.app"
    - x: 450
      y: 220
      type: link
      path: /Applications
      name: "Applications"

extraMetadata:
  main: dist-electron/main/index.js

publish:
  provider: generic
  url: https://file.deskwand.com
  channel: latest
